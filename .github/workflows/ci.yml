name: CI - Build, Test (Kind), Scan, Push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: upwind-app
  KIND_CLUSTER_NAME: chart-testing

jobs:
  build-test-scan-push:
    name: Build, Test in Kind, Security Scan, and Push
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. בניית האימג' ושמירה לוקאלית (load: true)
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          load: true # קריטי! שומר את האימג' ב-Docker של ה-Runner
          tags: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # 2. הקמת קלאסטר Kind
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.9.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}

      # 3. טעינת האימג' לתוך הקלאסטר (אחרת Kind לא יכיר אותו)
      - name: Load Docker image into Kind
        run: |
          kind load docker-image ${{ env.ECR_REPOSITORY }}:${{ github.sha }} --name ${{ env.KIND_CLUSTER_NAME }}

      # 4. בדיקת Smoke Test - האם הפוד עולה?
      - name: Test App on Kind
        run: |
          echo "Deploying pod to Kind..."
          # image-pull-policy=Never מבטיח שימוש באימג' המקומי שטענו
          kubectl run test-app --image=${{ env.ECR_REPOSITORY }}:${{ github.sha }} --restart=Never --image-pull-policy=Never
          
          echo "Waiting for pod to be ready..."
          kubectl wait --for=condition=Ready pod/test-app --timeout=60s
          
          echo "Test Passed! Pod is running. Cleaning up..."
          kubectl delete pod test-app

      # 5. סריקות אבטחה (רצות רק אם הבדיקה עברה)
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./app/Dockerfile
          failure-threshold: warning

      # 6. התחברות ודחיפה (רק אם זה Main)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        if: github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest