name: CI - Build, Test (Kind), Scan, Push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  KIND_CLUSTER_NAME: chart-testing

jobs:
  build-test-scan-push:
    name: Build, Test in Kind, Security Scan, and Push
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Backend
      - name: Build Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: false
          load: true
          tags: upwind-backend:${{ github.sha }}

      # Build Frontend
      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: false
          load: true
          tags: upwind-frontend:${{ github.sha }}

      # Kind Cluster
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.9.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}

      - name: Load images into Kind
        run: |
          kind load docker-image upwind-backend:${{ github.sha }} --name ${{ env.KIND_CLUSTER_NAME }}
          kind load docker-image upwind-frontend:${{ github.sha }} --name ${{ env.KIND_CLUSTER_NAME }}

      # Test Backend
      - name: Test Backend on Kind
        run: |
          kubectl run test-backend --image=upwind-backend:${{ github.sha }} --restart=Never --image-pull-policy=Never
          kubectl wait --for=condition=Ready pod/test-backend --timeout=60s
          kubectl delete pod test-backend

      # Security Scans
      - name: Trivy scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: upwind-backend:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Trivy scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: upwind-frontend:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Lint Backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./app/backend/Dockerfile
          failure-threshold: warning

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./app/frontend/Dockerfile
          failure-threshold: warning

      # Push to ECR
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Backend to ECR
        if: github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag upwind-backend:$IMAGE_TAG $ECR_REGISTRY/upwind-backend:$IMAGE_TAG
          docker tag upwind-backend:$IMAGE_TAG $ECR_REGISTRY/upwind-backend:latest
          docker push $ECR_REGISTRY/upwind-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/upwind-backend:latest

      - name: Push Frontend to ECR
        if: github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag upwind-frontend:$IMAGE_TAG $ECR_REGISTRY/upwind-frontend:$IMAGE_TAG
          docker tag upwind-frontend:$IMAGE_TAG $ECR_REGISTRY/upwind-frontend:latest
          docker push $ECR_REGISTRY/upwind-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/upwind-frontend:latest