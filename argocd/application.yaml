apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: upwind-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bendagan85/upwind-security-platform.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: upwind-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true