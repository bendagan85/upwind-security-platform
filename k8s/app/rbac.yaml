apiVersion: v1
kind: ServiceAccount
metadata:
  name: upwind-app-sa
  namespace: upwind-app

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: upwind-app-role
  namespace: upwind-app
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: upwind-app-rolebinding
  namespace: upwind-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: upwind-app-role
subjects:
- kind: ServiceAccount
  name: upwind-app-sa
  namespace: upwind-app