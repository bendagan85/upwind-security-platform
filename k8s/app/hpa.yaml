apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: upwind-app-hpa
  namespace: upwind-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: upwind-app   
  minReplicas: 1
  maxReplicas: 10       
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50 