apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp-ingress
  namespace: upwind-app  
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: app.upwind.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: upwind-app 
            port:
              number: 80