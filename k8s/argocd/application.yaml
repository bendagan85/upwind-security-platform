apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: upwind-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bendagan85/upwind-security-platform
    targetRevision: main
    path: helm/backend
  destination:
    server: https://kubernetes.default.svc
    namespace: upwind-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
