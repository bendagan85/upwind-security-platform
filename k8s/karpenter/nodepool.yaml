apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.micro", "t3.small", "t3a.micro", "t3a.small"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
  limits:
    cpu: "20"
    memory: 40Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: KarpenterNodeRole-upwind-cluster
  subnetSelectorTerms:
    - id: subnet-02e03760880c5a957
    - id: subnet-0384826d50ac6b2ea
    - id: subnet-04f4894ed481b10c8
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: upwind-cluster
  tags:
    Name: karpenter-node