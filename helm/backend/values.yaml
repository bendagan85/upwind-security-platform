replicaCount: 2

image:
  repository: 002757291574.dkr.ecr.us-east-1.amazonaws.com/upwind-backend
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

env:
  DB_HOST: postgresql
  DB_PORT: "5432"
  DB_NAME: upwind
  DB_USER: upwind

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPU: 50